name: Maker Calculator regression tests
on:
  push:
    branches:
      - maker-calculator-launch-hardening
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/launch-hardening-engine.js
          node --check tests/launch-hardening-tests.js
          node --check tests/launch-hardening-engine-tests.js
      - name: Check browser contract
        run: node tests/browser-contract.cjs
      - name: Install browser test dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Run real browser smoke tests
        run: node tests/browser-runtime.cjs
      - name: Run primary regression suite
        run: node tests/launch-hardening-tests.js
      - name: Run engine regression suite
        run: node tests/launch-hardening-engine-tests.js
